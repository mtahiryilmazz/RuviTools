[package]
name = "ruvid"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "RUVID — Rust Video Downloader (HTTP, Range/Resume, HLS/DASH VOD CLI)"

[[bin]]
name = "ruvid"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
directories = "6"
futures = "0.3"
indicatif = "0.17"
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
