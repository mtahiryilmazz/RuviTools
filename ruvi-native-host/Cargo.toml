[package]
name = "ruvi-native-host"
version = "2.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "GeTube v2.0 Pure-Rust Chrome Native Messaging Host powered in-process by ruvid and ruvic"

[[bin]]
name = "NativeHost"
path = "src/main.rs"

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
ruvid = { path = "../ruvid" }
ruvic = { path = "../ruvic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
