[package]
name = "ruvic"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "RUVIC — Rust Video Converter (pure-Rust media engine, zero external binaries)"
repository = "https://github.com/mtahiryilmazz/RuviTools"
homepage = "https://github.com/mtahiryilmazz/RuviTools/tree/main/ruvic"
documentation = "https://github.com/mtahiryilmazz/RuviTools/tree/main/ruvic/docs"
readme = "README.md"
keywords = ["video", "ffmpeg", "mp4", "dash", "cli"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "ruvic"
path = "src/main.rs"

[[bench]]
name = "native_engine"
harness = false

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
directories = "6"
indicatif = "0.17"
mimalloc = { version = "0.1", optional = true }
rusty_mp3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "mkv", "ogg", "aac", "pcm", "vorbis", "mp3", "flac", "wav"] }
symphonia-opus = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process", "signal"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
