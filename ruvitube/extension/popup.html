<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>RuviTube</title>
  <style>
    :root { --bg:#141414; --panel:#1f1f1f; --line:#333; --text:#f1f1f1; --muted:#a0a0a0; --accent:#cc0000; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", Roboto, Arial, sans-serif; }
    header { display:flex; align-items:center; gap:8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    header img { width: 20px; height: 20px; }
    header strong { font-size: 14px; font-weight: 600; }
    header span { margin-left: auto; color: var(--muted); font-size: 11px; }
    .body { padding: 12px 14px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    .job { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
    .job .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .job .top em { font-style: normal; color: var(--muted); }
    .bar { height: 3px; background: #2e2e2e; border-radius: 999px; margin-top: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); width: 0; }
    .job.done .bar span { background: #2ecc71; }
    .job.failed .bar span { background: #e04b4b; }
    .empty { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
      margin-bottom: 10px; background: var(--panel); font-size: 12px;
    }
    .setting-row label { color: var(--text); }
    .setting-row select {
      background: #121212; color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 8px; font: inherit; min-width: 84px;
    }
    .setting-row select:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1; background: #2b2b2b; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer;
    }
    button:hover { background: #3a3a3a; }
    .hint { color: var(--muted); font-size: 11.5px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <header>
    <img src="icon32.png" alt="">
    <strong>RuviTube</strong>
    <span id="version"></span>
  </header>
  <div class="body">
    <h2 data-i18n="popupLast">Son işler</h2>
    <div id="jobs"><div class="empty" data-i18n="popupIdle">Bekleyen indirme yok</div></div>
    <div class="setting-row">
      <label for="jobsSelect" data-i18n="popupJobs">Paralel Range Parçaları (--jobs)</label>
      <select id="jobsSelect">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>
    </div>
    <div class="actions">
      <button id="options" data-i18n="popupSettings">Ayarlar</button>
      <button id="downloads" data-i18n="popupDownloads">İndirilenler</button>
    </div>
    <p class="hint" data-i18n="popupOpenYoutube">YouTube'da bir video açın</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
