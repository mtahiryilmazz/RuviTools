# RuviTools — cargo-deny Supply-Chain, License & Ban Policy
# Applies across all 4 standalone crates: ruvid, ruvic, ruvi-native-host, ruvi-gui

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true
no-default-features = false

[advisories]
yanked = "warn"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# egui's epaint_default_fonts bundles Ubuntu & Noto/Hack font assets under OFL-1.1 AND Ubuntu-font-1.0
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = [
    "MIT",
    "Apache-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Flag OpenSSL native C dependency: no crate other than `openssl` may pull `openssl-sys`.
# Once reqwest switches from default-tls (`native-tls`) to `rustls-tls`, remove `wrappers` to deny completely.
deny = [
    { crate = "openssl-sys", wrappers = ["openssl"], reason = "Prefer pure-Rust rustls-tls; openssl-sys is only tolerated temporarily via reqwest default-tls -> native-tls -> openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
