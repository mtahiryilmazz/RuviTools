# RuviTools — cargo-deny Supply-Chain, License & Ban Policy
# Applies across all 4 standalone crates: ruvid, ruvic, ruvi-native-host, ruvi-gui

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true
no-default-features = false

[advisories]
yanked = "warn"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Hard-ban the native OpenSSL C stack: all HTTP clients use pure-Rust `rustls-tls`
# (reqwest with `default-features = false`), so `openssl-sys`/`native-tls`/`schannel`
# must never reappear in the graph.
deny = [
    { crate = "openssl-sys", reason = "All HTTP goes through reqwest + rustls-tls; native OpenSSL must not be reintroduced" },
    { crate = "native-tls", reason = "Use rustls-tls for TLS; native-tls pulls platform TLS/OpenSSL" },
    { crate = "schannel", reason = "Use rustls-tls for TLS; schannel is the Windows native-tls backend" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
