<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1060" width="1280" height="1060">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 30px "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #64748b; }
      .hdr-box-gray { fill: #f1f5f9; rx: 10px; }
      .hdr-box-blue { fill: #eff6ff; rx: 10px; }
      .hdr-box-green { fill: #ecfdf5; rx: 10px; }
      .hdr-txt-gray { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #334155; letter-spacing: 0.05em; }
      .hdr-txt-blue { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #1e3a8a; letter-spacing: 0.05em; }
      .hdr-txt-green { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #065f46; letter-spacing: 0.05em; }
      .cell-gray { fill: #f8fafc; rx: 12px; }
      .cell-blue { fill: #f0f7ff; rx: 12px; }
      .cell-green { fill: #eefdf4; rx: 12px; }
      .metric-title { font: 700 15.5px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .metric-sub { font: 500 11.5px "Segoe UI", Inter, Arial, sans-serif; fill: #64748b; }
      .val-blue { font: 800 22px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .val-green { font: 800 22px "Segoe UI", Inter, Arial, sans-serif; fill: #15803d; }
      .diff-main { font: 800 21px "Segoe UI", Inter, Arial, sans-serif; fill: #15803d; text-anchor: middle; }
      .diff-sub1 { font: 600 11.5px "Segoe UI", Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .diff-sub2 { font: 400 10.5px "Segoe UI", Inter, Arial, sans-serif; fill: #94a3b8; text-anchor: middle; }
      .track-blue { fill: #dbeafe; rx: 4.5px; }
      .track-green { fill: #d1fae5; rx: 4.5px; }
      .bar-blue { fill: #2563eb; rx: 4.5px; }
      .bar-green { fill: #16a34a; rx: 4.5px; }
    </style>
  </defs>

  <rect width="1280" height="1060" class="bg" rx="18"/>

  <!-- Header -->
  <rect x="44" y="34" width="6" height="36" rx="3" fill="#ff4d1a"/>
  <text x="62" y="62" class="title">ruvic (Saf Rust) vs FFmpeg / FFprobe — Medya İşleme &amp; Dönüştürme Kıyaslaması</text>
  <text x="62" y="86" class="subtitle">Kayıpsız fMP4/WebM birleştirme, kesit kırpma, MP3 320k/VBR &amp; WAV ses kodlama, kapak/albüm etiketleme ve bellek bütünlüğü</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Column Headers -->
  <rect x="44" y="118" width="256" height="44" class="hdr-box-gray"/>
  <text x="64" y="145" class="hdr-txt-gray">METRİK / İŞLEM TÜRÜ</text>

  <rect x="316" y="118" width="330" height="44" class="hdr-box-blue"/>
  <rect x="330" y="130" width="3.5" height="20" rx="1.75" fill="#2563eb"/>
  <text x="344" y="145" class="hdr-txt-blue">GELENEKSEL (FFmpeg / FFprobe C)</text>

  <rect x="662" y="118" width="330" height="44" class="hdr-box-green"/>
  <rect x="676" y="130" width="3.5" height="20" rx="1.75" fill="#16a34a"/>
  <text x="690" y="145" class="hdr-txt-green">SAF RUST (ruvic v2.1 · Native Engine)</text>

  <rect x="1008" y="118" width="228" height="44" class="hdr-box-gray"/>
  <text x="1122" y="145" class="hdr-txt-gray" text-anchor="middle">DEĞİŞİM / FARK</text>

  <!-- Row 1: Container Probe -->
  <g transform="translate(0, 176)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Konteyner Analizi (Probe)</text>
    <text x="64" y="56" class="metric-sub">11,4 MB MP4 (H.264 + AAC + HDR/VR)</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">88,40 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="250" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">14,34 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="40" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">6,2× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">−%83,8 analiz gecikmesi</text>
    <text x="1122" y="69" class="diff-sub2">mdat gövdesini atlayan sıfır-kopya atom tarayıcı</text>
  </g>

  <!-- Row 2: Dual-Stream fMP4 Video+Audio Mux -->
  <g transform="translate(0, 272)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Çift Akış Kayıpsız Birleştirme</text>
    <text x="64" y="56" class="metric-sub">720p Video + M4A Ses → Tek MP4 (11,4 MB)</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">142,0 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="260" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">13,54 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="25" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">10,5× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">−%90,5 birleştirme süresi (milisaniye seviyesi)</text>
    <text x="1122" y="69" class="diff-sub2">Doğrudan tfdt sıralı moof/mdat &amp; Cluster harmanlama</text>
  </g>

  <!-- Row 3: Faststart moov Relocation -->
  <g transform="translate(0, 368)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">MP4 Faststart (moov Taşıma)</text>
    <text x="64" y="56" class="metric-sub">stco/co64 ofset yeniden hesaplama</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">118,5 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="240" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">15,64 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="32" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">7,6× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">−%86,8 remux gecikmesi</text>
    <text x="1122" y="69" class="diff-sub2">Tek geçişli 256 KB akışsal atom yeniden yazımı</text>
  </g>

  <!-- Row 4: Lossless Keyframe Clip Trim -->
  <g transform="translate(0, 464)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Kayıpsız Kesit/Bölüm Kırpma</text>
    <text x="64" y="56" class="metric-sub">Bölüm 11 (09:13–10:12 · 59 sn) VLC uyumlu</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">134,2 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="248" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">15,75 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="30" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">8,5× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">Keyframe hizalı + 00:00 sıfırlamalı tfdt/Cluster</text>
    <text x="1122" y="69" class="diff-sub2">VLC ve Windows Media Player'da anında açılır</text>
  </g>

  <!-- Row 5: MP3 320kbps + ID3v2.3 + Cover Art -->
  <g transform="translate(0, 560)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">MP3 320 kbps + Albüm/Kapak</text>
    <text x="64" y="56" class="metric-sub">218 sn şarkı (Symphonia → rusty_mp3 + ID3v2.3)</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">2,42 sn (Harici Kapak Komutu)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="215" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">2,18 sn (8,74 MB · 11 ID3 Çerçevesi)</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="188" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">+%10,0 Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">TIT2/TPE1/TALB/TYER/APIC kapak tek geçişte</text>
    <text x="1122" y="69" class="diff-sub2">Sıfır-kopya Cow&lt;[f32]&gt; PCM tamponu</text>
  </g>

  <!-- Row 6: Peak RAM Usage -->
  <g transform="translate(0, 656)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Tepe Bellek Kullanımı (RAM)</text>
    <text x="64" y="56" class="metric-sub">Remux &amp; Kırpma sırasında Working Set</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">48,60 MB</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="260" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">3,23 MB</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="18" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">−%93,4 Bellek</text>
    <text x="1122" y="53" class="diff-sub1">15,0× daha az RAM tüketimi</text>
    <text x="1122" y="69" class="diff-sub2">1,29 GB 4K dosyada bile &lt; 8 MB sabit RAM</text>
  </g>

  <!-- Row 7: Memory Safety & Integrity -->
  <g transform="translate(0, 752)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Bellek Bütünlüğü &amp; Güvenlik</text>
    <text x="64" y="56" class="metric-sub">Dil güvenliği ve atomik dosya taahhüdü</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">C / Manuel İşaretçi (Pointer)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="110" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">%100 Bellek Güvenli Saf Rust</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="286" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">Sıfır Buffer Overflow</text>
    <text x="1122" y="53" class="diff-sub1">Bozuk atom/box durumunda çıkış kodu 8 + temizlik</text>
    <text x="1122" y="69" class="diff-sub2">Atomik .tmp → nihai dosya yeniden adlandırma</text>
  </g>

  <!-- Row 8: Binary Size -->
  <g transform="translate(0, 848)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">İkili Dosya Boyutu (Binary)</text>
    <text x="64" y="56" class="metric-sub">Disk üzerindeki çalıştırılabilir boyut</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">160,48 MB (ffmpeg.exe)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="276" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">5,36 MB (ruvic.exe)</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="14" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">29,9× Daha Küçük</text>
    <text x="1122" y="53" class="diff-sub1">−%96,7 ikili dosya boyutu (155,1 MB kazanç)</text>
    <text x="1122" y="69" class="diff-sub2">Sıfır C/C++ DLL bağımlılığı · bağımsız exe</text>
  </g>

  <!-- Footer Note -->
  <text x="44" y="968" class="subtitle">Not: Ölçümler aynı makinede kurulu ffmpeg.exe (160,48 MB) ve saf Rust ile derlenen ruvic.exe (5,36 MB / 5.624.320 bayt) üzerinde gerçekleştirilmiştir.</text>
</svg>
