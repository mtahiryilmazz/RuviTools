<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1060" width="1280" height="1060">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 30px "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #64748b; }
      .hdr-box-gray { fill: #f1f5f9; rx: 10px; }
      .hdr-box-blue { fill: #eff6ff; rx: 10px; }
      .hdr-box-green { fill: #ecfdf5; rx: 10px; }
      .hdr-txt-gray { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #334155; letter-spacing: 0.05em; }
      .hdr-txt-blue { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #1e3a8a; letter-spacing: 0.05em; }
      .hdr-txt-green { font: 700 13px "Segoe UI", Inter, Arial, sans-serif; fill: #065f46; letter-spacing: 0.05em; }
      .cell-gray { fill: #f8fafc; rx: 12px; }
      .cell-blue { fill: #f0f7ff; rx: 12px; }
      .cell-green { fill: #eefdf4; rx: 12px; }
      .metric-title { font: 700 15.5px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .metric-sub { font: 500 11.5px "Segoe UI", Inter, Arial, sans-serif; fill: #64748b; }
      .val-blue { font: 800 22px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .val-green { font: 800 22px "Segoe UI", Inter, Arial, sans-serif; fill: #15803d; }
      .diff-main { font: 800 21px "Segoe UI", Inter, Arial, sans-serif; fill: #15803d; text-anchor: middle; }
      .diff-sub1 { font: 600 11.5px "Segoe UI", Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .diff-sub2 { font: 400 10.5px "Segoe UI", Inter, Arial, sans-serif; fill: #94a3b8; text-anchor: middle; }
      .track-blue { fill: #dbeafe; rx: 4.5px; }
      .track-green { fill: #d1fae5; rx: 4.5px; }
      .bar-blue { fill: #2563eb; rx: 4.5px; }
      .bar-green { fill: #16a34a; rx: 4.5px; }
    </style>
  </defs>

  <rect width="1280" height="1060" class="bg" rx="18"/>

  <!-- Header -->
  <rect x="44" y="34" width="6" height="36" rx="3" fill="#2563eb"/>
  <text x="62" y="62" class="title">ruvid (Saf Rust) vs yt-dlp — İndirme, Çözümleme ve Sistem Kıyaslaması</text>
  <text x="62" y="86" class="subtitle">Gerçek YouTube DASH/Innertube akışları üzerinde ölçülen soğuk başlatma, çözümleme, paralel indirme, RAM, CPU ve ikili boyut sonuçları</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Column Headers -->
  <rect x="44" y="118" width="256" height="44" class="hdr-box-gray"/>
  <text x="64" y="145" class="hdr-txt-gray">METRİK / TEST SENARYOSU</text>

  <rect x="316" y="118" width="330" height="44" class="hdr-box-blue"/>
  <rect x="330" y="130" width="3.5" height="20" rx="1.75" fill="#2563eb"/>
  <text x="344" y="145" class="hdr-txt-blue">GELENEKSEL (yt-dlp + Python/Deno)</text>

  <rect x="662" y="118" width="330" height="44" class="hdr-box-green"/>
  <rect x="676" y="130" width="3.5" height="20" rx="1.75" fill="#16a34a"/>
  <text x="690" y="145" class="hdr-txt-green">SAF RUST (ruvid v2.1 · tokio + rustls)</text>

  <rect x="1008" y="118" width="228" height="44" class="hdr-box-gray"/>
  <text x="1122" y="145" class="hdr-txt-gray" text-anchor="middle">DEĞİŞİM / FARK</text>

  <!-- Row 1: Cold Start Latency -->
  <g transform="translate(0, 176)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Soğuk Başlatma Süresi</text>
    <text x="64" y="56" class="metric-sub">CLI başlatma &amp; çalışma zamanı yükü</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">680,0 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="272" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">13,65 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="18" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">49,8× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">−%98,0 gecikme (666 ms kazanç)</text>
    <text x="1122" y="69" class="diff-sub2">Python VM yerine doğrudan makine kodu</text>
  </g>

  <!-- Row 2: Innertube Stream Probe -->
  <g transform="translate(0, 272)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">YouTube Akış Çözümleme</text>
    <text x="64" y="56" class="metric-sub">32 akış + 22 bölüm + altyazı tespiti</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">2.450 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="265" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">310 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="38" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">7,9× Daha Hızlı</text>
    <text x="1122" y="53" class="diff-sub1">−%87,3 çözümleme süresi</text>
    <text x="1122" y="69" class="diff-sub2">850 KB HTML indirmeden doğrudan Innertube</text>
  </g>

  <!-- Row 3: Parallel Range Download Speed -->
  <g transform="translate(0, 368)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">4K DASH İndirme Hızı</text>
    <text x="64" y="56" class="metric-sub">1,29 GB 4K Video+Ses (--jobs 16)</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">9,4 MB/sn</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="100" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">26,9 MB/sn</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="272" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">+%186,2 Hız</text>
    <text x="1122" y="53" class="diff-sub1">1,29 GB dosya 48 saniyede tamamlandı</text>
    <text x="1122" y="69" class="diff-sub2">4 MiB dinamik Range parçalı tokio::try_join!</text>
  </g>

  <!-- Row 4: Peak Working Set RAM -->
  <g transform="translate(0, 464)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Tepe Bellek Kullanımı (RAM)</text>
    <text x="64" y="56" class="metric-sub">Peak Working Set (MB)</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">64,80 MB</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="255" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">3,98 MB</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="20" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">−%93,9 Bellek</text>
    <text x="1122" y="53" class="diff-sub1">16,3× daha düşük RAM ayak izi</text>
    <text x="1122" y="69" class="diff-sub2">Sabit 256 KB akış tamponu · GC yok</text>
  </g>

  <!-- Row 5: CPU Time Overhead -->
  <g transform="translate(0, 560)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">İşlemci Yükü (CPU Süresi)</text>
    <text x="64" y="56" class="metric-sub">100 MB paralel indirme başına CPU ms</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">1.120 ms</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="248" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">62 ms</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="22" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">−%94,5 CPU Yükü</text>
    <text x="1122" y="53" class="diff-sub1">18× daha düşük işlemci kullanımı</text>
    <text x="1122" y="69" class="diff-sub2">Asenkron epoll/IOCP + sıfır-kopya disk yazımı</text>
  </g>

  <!-- Row 6: Multi-WAN Auto-Failover -->
  <g transform="translate(0, 656)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Çoklu-WAN Otomatik Geçiş</text>
    <text x="64" y="56" class="metric-sub">HTTP 403 durumunda ikinci ağ kartına geçiş</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">Yok (Manuel --source-address)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="30" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">Otomatik (&lt; 0,1 ms Keşif)</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="286" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">%100 Otomatik</text>
    <text x="1122" y="53" class="diff-sub1">TELEKOM 403 → TURKCELL otomatik geçiş</text>
    <text x="1122" y="69" class="diff-sub2">Çalışan yerel WAN IP'sini bellekte önbellekler</text>
  </g>

  <!-- Row 7: Checkpoint Resume & Ephemeral CDN Protection -->
  <g transform="translate(0, 752)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">İmzalı CDN &amp; Kesinti Kurtarma</text>
    <text x="64" y="56" class="metric-sub">Süresi dolan googlevideo.com URL yönetimi</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">Tek Akış .part (Range Yok)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="120" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">Atomik JSON + Otomatik Sıfırlama</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="286" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">Sıfır Çakışma</text>
    <text x="1122" y="53" class="diff-sub1">Ephemeral CDN URL değişiminde temiz başlangıç</text>
    <text x="1122" y="69" class="diff-sub2">Statik HTTP'de ETag + parça bit-haritası doğrulama</text>
  </g>

  <!-- Row 8: Standalone Binary & Runtime Footprint -->
  <g transform="translate(0, 848)">
    <rect x="44" y="0" width="256" height="84" class="cell-gray"/>
    <text x="64" y="36" class="metric-title">Kurulum &amp; Bağımlılık Boyutu</text>
    <text x="64" y="56" class="metric-sub">Çalışma zamanı dahil toplam disk boyutu</text>

    <rect x="316" y="0" width="330" height="84" class="cell-blue"/>
    <text x="338" y="38" class="val-blue">~95 MB (Python + Deno + OpenSSL)</text>
    <rect x="338" y="54" width="286" height="9" class="track-blue"/>
    <rect x="338" y="54" width="268" height="9" class="bar-blue"/>

    <rect x="662" y="0" width="330" height="84" class="cell-green"/>
    <text x="684" y="38" class="val-green">7,15 MB (Tek Başına ruvid.exe)</text>
    <rect x="684" y="54" width="286" height="9" class="track-green"/>
    <rect x="684" y="54" width="24" height="9" class="bar-green"/>

    <rect x="1008" y="0" width="228" height="84" class="cell-gray"/>
    <text x="1122" y="34" class="diff-main">−%92,5 Boyut</text>
    <text x="1122" y="53" class="diff-sub1">13,3× daha küçük tekil çalıştırılabilir dosya</text>
    <text x="1122" y="69" class="diff-sub2">Sıfır Python, sıfır Deno, %100 saf Rust + rustls</text>
  </g>

  <!-- Footer Note -->
  <text x="44" y="968" class="subtitle">Not: Tüm ölçümler Windows 11 x64 üzerinde --release profili ile derlenmiş ruvid v2.1.0 (7.492.608 bayt) kullanılarak gerçek YouTube akışlarında kaydedilmiştir.</text>
</svg>
