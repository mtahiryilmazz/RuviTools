<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" fill="url(#bg)" rx="16"/>

  <!-- Header -->
  <text x="40" y="48" fill="#f9fafb" font-size="26" font-weight="700">RuviTools (ruvid + ruvic) — Performans, Bellek ve Boyut Grafikleri</text>
  <text x="40" y="74" fill="#9ca3af" font-size="14">Saf Rust Mimari · Minimal Bellek Yükü (Streaming I/O) · Yüksek Hız · Sistem Bütünlüğü (Atomik Yazım &amp; Bounds Check)</text>

  <!-- KPI Cards Row -->
  <g transform="translate(40, 95)">
    <rect width="265" height="82" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="18" y="28" fill="#9ca3af" font-size="12" font-weight="600">TOPLAM UYGULAMA BOYUTU</text>
    <text x="18" y="58" fill="#34d399" font-size="26" font-weight="700">10.50 MB</text>
    <text x="145" y="58" fill="#6ee7b7" font-size="13">~34x daha küçük</text>
    <text x="18" y="73" fill="#6b7280" font-size="11">ruvid (7.01 MB) + ruvic (3.49 MB)</text>
  </g>
  <g transform="translate(325, 95)">
    <rect width="265" height="82" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="18" y="28" fill="#9ca3af" font-size="12" font-weight="600">50.3 MB MP4 REMUX HIZI</text>
    <text x="18" y="58" fill="#38bdf8" font-size="26" font-weight="700">42.36 ms</text>
    <text x="145" y="58" fill="#7dd3fc" font-size="13">~1,187 MB/sn</text>
    <text x="18" y="73" fill="#6b7280" font-size="11">Seek + 64KB/1MB Streaming Buffer</text>
  </g>
  <g transform="translate(610, 95)">
    <rect width="265" height="82" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="18" y="28" fill="#9ca3af" font-size="12" font-weight="600">50.3 MB DOSYADA ÖZEL RAM</text>
    <text x="18" y="58" fill="#a78bfa" font-size="26" font-weight="700">3.53 MB</text>
    <text x="135" y="58" fill="#c4b5fd" font-size="13">Dosyanın %7'si</text>
    <text x="18" y="73" fill="#6b7280" font-size="11">PeakWorkingSet: 8.98 MB (Sınırlı Tampon)</text>
  </g>
  <g transform="translate(895, 95)">
    <rect width="265" height="82" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="18" y="28" fill="#9ca3af" font-size="12" font-weight="600">CANLI YOUTUBE DASH + REMUX</text>
    <text x="18" y="58" fill="#fbbf24" font-size="26" font-weight="700">1.54 sn</text>
    <text x="125" y="58" fill="#fde68a" font-size="13">16 Range Parçası</text>
    <text x="18" y="73" fill="#6b7280" font-size="11">itag-133 + itag-140 Paralel + Otomatik Mux</text>
  </g>

  <!-- PANEL 1: Binary Footprint Comparison (Top Left) -->
  <g transform="translate(40, 198)">
    <rect width="545" height="295" rx="14" fill="#161f30" stroke="#283548"/>
    <text x="22" y="32" fill="#f3f4f6" font-size="17" font-weight="700">1. Uygulama Boyutu Kıyaslaması (MB — Düşük Daha İyi)</text>
    <text x="22" y="52" fill="#9ca3af" font-size="12">Harici çalışma zamanı gerektirmeyen tekil Rust ikilileri vs. piyasa araçları</text>

    <!-- Bars (max scale = 380 MB -> 360px) -->
    <g transform="translate(22, 74)">
      <text x="0" y="16" fill="#d1d5db" font-size="13" font-weight="600">ruvic.exe (Native Motor)</text>
      <rect x="185" y="2" width="6" height="20" rx="4" fill="url(#emerald)"/>
      <text x="199" y="17" fill="#34d399" font-size="13" font-weight="700">3.49 MB</text>

      <text x="0" y="54" fill="#d1d5db" font-size="13" font-weight="600">ruvid.exe (İndirici)</text>
      <rect x="185" y="40" width="10" height="20" rx="4" fill="url(#emerald)"/>
      <text x="203" y="55" fill="#34d399" font-size="13" font-weight="700">7.01 MB</text>

      <text x="0" y="92" fill="#f9fafb" font-size="13" font-weight="700">RuviTools Toplam</text>
      <rect x="185" y="78" width="15" height="22" rx="4" fill="url(#cyan)"/>
      <text x="208" y="94" fill="#38bdf8" font-size="14" font-weight="700">10.50 MB (Sıfır Bağımlılık)</text>

      <text x="0" y="132" fill="#9ca3af" font-size="13">yt-dlp + deno runtime</text>
      <rect x="185" y="118" width="132" height="20" rx="4" fill="url(#amber)"/>
      <text x="325" y="133" fill="#fbbf24" font-size="13" font-weight="600">~140 MB</text>

      <text x="0" y="170" fill="#9ca3af" font-size="13">ffmpeg + ffprobe</text>
      <rect x="185" y="156" width="208" height="20" rx="4" fill="url(#amber)"/>
      <text x="401" y="171" fill="#fbbf24" font-size="13" font-weight="600">~220 MB</text>

      <text x="0" y="208" fill="#fca5a5" font-size="13" font-weight="600">Piyasa Yığını Toplamı</text>
      <rect x="185" y="194" width="275" height="22" rx="4" fill="url(#rose)"/>
      <text x="466" y="210" fill="#fb7185" font-size="13" font-weight="700">~360 MB</text>
    </g>
  </g>

  <!-- PANEL 2: 50.3 MB Streaming vs RAM Footprint (Top Right) -->
  <g transform="translate(615, 198)">
    <rect width="545" height="295" rx="14" fill="#161f30" stroke="#283548"/>
    <text x="22" y="32" fill="#f3f4f6" font-size="17" font-weight="700">2. Bellek Yükü (RAM) Kanıtı (MB — Düşük Daha İyi)</text>
    <text x="22" y="52" fill="#9ca3af" font-size="12">50.3 MB MP4 işlenirken tüm dosya RAM'e alınmaz (Seek + 64KB/1MB Streaming)</text>

    <g transform="translate(22, 74)">
      <text x="0" y="16" fill="#9ca3af" font-size="13">Girdi Dosya Boyutu</text>
      <rect x="195" y="2" width="250" height="20" rx="4" fill="#4b5563"/>
      <text x="453" y="17" fill="#d1d5db" font-size="13" font-weight="600">50.30 MB</text>

      <text x="0" y="54" fill="#d1d5db" font-size="13" font-weight="600">ruvic probe (Özel RAM)</text>
      <rect x="195" y="40" width="5" height="20" rx="3" fill="url(#emerald)"/>
      <text x="208" y="55" fill="#34d399" font-size="13" font-weight="700">0.86 MB (WS: 3.22 MB)</text>

      <text x="0" y="92" fill="#d1d5db" font-size="13" font-weight="600">ruvic trim / audio M4A</text>
      <rect x="195" y="78" width="5" height="20" rx="3" fill="url(#emerald)"/>
      <text x="208" y="93" fill="#34d399" font-size="13" font-weight="700">0.82 MB (WS: 3.11 MB)</text>

      <text x="0" y="130" fill="#d1d5db" font-size="13" font-weight="600">ruvic 50.3MB Remux (Özel)</text>
      <rect x="195" y="116" width="18" height="20" rx="4" fill="url(#cyan)"/>
      <text x="221" y="131" fill="#38bdf8" font-size="13" font-weight="700">3.53 MB (WS: 8.98 MB)</text>

      <text x="0" y="168" fill="#d1d5db" font-size="13" font-weight="600">ruvid --jobs 4 Canlı YT (Özel)</text>
      <rect x="195" y="154" width="54" height="20" rx="4" fill="url(#violet)"/>
      <text x="257" y="169" fill="#c4b5fd" font-size="13" font-weight="700">10.74 MB (WS: 19.29 MB)</text>

      <text x="0" y="206" fill="#d1d5db" font-size="13" font-weight="600">ruvid DASH 16-Parça + Mux</text>
      <rect x="195" y="192" width="55" height="20" rx="4" fill="url(#violet)"/>
      <text x="258" y="207" fill="#c4b5fd" font-size="13" font-weight="700">10.83 MB (WS: 19.70 MB)</text>
    </g>
  </g>

  <!-- PANEL 3: ruvic Native Media Engine Operation Speed (Bottom Left) -->
  <g transform="translate(40, 515)">
    <rect width="545" height="305" rx="14" fill="#161f30" stroke="#283548"/>
    <text x="22" y="32" fill="#f3f4f6" font-size="17" font-weight="700">3. ruvic Saf Rust Medya Motoru İşlem Süreleri (ms)</text>
    <text x="22" y="52" fill="#9ca3af" font-size="12">Milisaniye cinsinden gerçek çalışma süresi (Düşük Daha İyi)</text>

    <g transform="translate(22, 74)">
      <text x="0" y="16" fill="#d1d5db" font-size="13" font-weight="600">probe (50.3 MB MP4)</text>
      <rect x="195" y="2" width="68" height="20" rx="4" fill="url(#emerald)"/>
      <text x="271" y="17" fill="#34d399" font-size="13" font-weight="700">17.08 ms</text>

      <text x="0" y="52" fill="#d1d5db" font-size="13" font-weight="600">probe (YouTube MP4)</text>
      <rect x="195" y="38" width="94" height="20" rx="4" fill="url(#emerald)"/>
      <text x="297" y="53" fill="#34d399" font-size="13" font-weight="700">23.59 ms</text>

      <text x="0" y="88" fill="#d1d5db" font-size="13" font-weight="600">trim (5 sn kesit)</text>
      <rect x="195" y="74" width="95" height="20" rx="4" fill="url(#emerald)"/>
      <text x="298" y="89" fill="#34d399" font-size="13" font-weight="700">23.78 ms</text>

      <text x="0" y="124" fill="#d1d5db" font-size="13" font-weight="600">audio (ADTS .aac demux)</text>
      <rect x="195" y="110" width="101" height="20" rx="4" fill="url(#cyan)"/>
      <text x="304" y="125" fill="#38bdf8" font-size="13" font-weight="700">25.38 ms</text>

      <text x="0" y="160" fill="#d1d5db" font-size="13" font-weight="600">remux (Faststart + stco)</text>
      <rect x="195" y="146" width="103" height="20" rx="4" fill="url(#cyan)"/>
      <text x="306" y="161" fill="#38bdf8" font-size="13" font-weight="700">25.65 ms</text>

      <text x="0" y="196" fill="#d1d5db" font-size="13" font-weight="600">audio (M4A kapsayıcı)</text>
      <rect x="195" y="182" width="103" height="20" rx="4" fill="url(#cyan)"/>
      <text x="306" y="197" fill="#38bdf8" font-size="13" font-weight="700">25.70 ms</text>

      <text x="0" y="226" fill="#f9fafb" font-size="13" font-weight="700">remux (50.3 MB Streaming)</text>
      <rect x="195" y="212" width="169" height="20" rx="4" fill="url(#violet)"/>
      <text x="372" y="227" fill="#c4b5fd" font-size="13" font-weight="700">42.36 ms (~1.19 GB/s)</text>
    </g>
  </g>

  <!-- PANEL 4: Cold Start & Live YouTube End-to-End (Bottom Right) -->
  <g transform="translate(615, 515)">
    <rect width="545" height="305" rx="14" fill="#161f30" stroke="#283548"/>
    <text x="22" y="32" fill="#f3f4f6" font-size="17" font-weight="700">4. Soğuk Başlangıç &amp; Canlı YouTube Uçtan Uca Süreler</text>
    <text x="22" y="52" fill="#9ca3af" font-size="12">Başlangıç gecikmesi ve canlı YouTube paralel Range/DASH indirme</text>

    <g transform="translate(22, 74)">
      <text x="0" y="16" fill="#34d399" font-size="13" font-weight="700">Soğuk Başlangıç (Cold-Start)</text>
      <text x="0" y="42" fill="#d1d5db" font-size="13">ruvic.exe --version</text>
      <rect x="195" y="28" width="11" height="18" rx="3" fill="url(#emerald)"/>
      <text x="214" y="42" fill="#34d399" font-size="13" font-weight="700">30.95 ms</text>

      <text x="0" y="70" fill="#d1d5db" font-size="13">ruvid.exe --version</text>
      <rect x="195" y="56" width="18" height="18" rx="3" fill="url(#emerald)"/>
      <text x="221" y="70" fill="#34d399" font-size="13" font-weight="700">50.23 ms</text>

      <text x="0" y="98" fill="#9ca3af" font-size="13">yt-dlp.exe (PyInstaller ref.)</text>
      <rect x="195" y="84" width="240" height="18" rx="3" fill="url(#rose)"/>
      <text x="443" y="98" fill="#fb7185" font-size="13" font-weight="600">~800 ms</text>

      <line x1="0" y1="116" x2="500" y2="116" stroke="#283548" stroke-dasharray="4 4"/>

      <text x="0" y="138" fill="#38bdf8" font-size="13" font-weight="700">Canlı YouTube İndirme (jNQXAC9IVRw — --jobs 4)</text>
      <text x="0" y="164" fill="#d1d5db" font-size="13">DASH Video+Ses + Oto-Remux</text>
      <rect x="195" y="150" width="154" height="18" rx="4" fill="url(#cyan)"/>
      <text x="357" y="164" fill="#38bdf8" font-size="13" font-weight="700">1.54 sn (16 parça)</text>

      <text x="0" y="194" fill="#d1d5db" font-size="13">Dinamik Range (--jobs 4)</text>
      <rect x="195" y="180" width="188" height="18" rx="4" fill="url(#emerald)"/>
      <text x="391" y="194" fill="#34d399" font-size="13" font-weight="700">1.88 sn (8 parça)</text>

      <text x="0" y="224" fill="#d1d5db" font-size="13">Video + 2 SRT Altyazı + JSON</text>
      <rect x="195" y="210" width="245" height="18" rx="4" fill="url(#violet)"/>
      <text x="448" y="224" fill="#c4b5fd" font-size="13" font-weight="700">2.84 sn</text>
    </g>
  </g>
</svg>
